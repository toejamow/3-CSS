<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 2 и 2* — Вертикальное выпадающее меню</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            padding: 20px;
        }

        .nav {
            width: 240px;
            background: linear-gradient(to bottom, #e1e1e1, rgb(208, 208, 208));
            border-radius: 4px;
            box-shadow: 5px 3px rgb(165, 165, 165);
        }

        .nav .pt {
            background: linear-gradient(to bottom, #e3e3e3, rgb(239, 239, 239));
            text-decoration: none;
            font-size: 20px;
            text-align: center;
            display: block;
            border-style: solid;
            border-width: 0 0 1px 0;
            border-color: #cccccc;
            border-radius: 4px;
            padding: 15px 20px;
            color: black;
            text-transform: uppercase;
            font-weight: 700;
        }

        .nav .pt:hover,
        .nav .item:hover > .pt {
            background: linear-gradient(to bottom, rgb(204, 204, 204), rgb(145, 145, 145));
        }

        .nav .item {
            position: relative;
            display: block;
            font-size: 20px;
            text-align: center;
        }

        .drop {
            position: absolute;
            display: none;
            top: 0;
            left: 100%;
            width: 180px;
            z-index: 10;
        }

        .drop_item {
            text-decoration: none;
            display: block;
            background: linear-gradient(to bottom, #e3e3e3, rgb(239, 239, 239));
            color: black;
            border-style: solid;
            border-width: 0 0 1px 0;
            border-color: #cccccc;
            border-radius: 4px;
            padding: 13px 20px;
            font-size: 20px;
        }

        .drop_item:hover,
        .sub-item:hover > .drop_item {
            background: linear-gradient(to bottom, rgb(204, 204, 204), rgb(145, 145, 145));
        }

        .sub-item {
            position: relative;
            display: block;
        }

        .nav .item:hover > .drop,
        .sub-item:hover > .drop {
            display: block;
        }
    </style>
</head>
<body>

    <div class="nav">
        <div class="item">
            <a class="pt" href="#">Главная</a>
            <div class="drop">
                <a class="drop_item" href="#">Главная страница</a>
                <a class="drop_item" href="#">Контакты</a>
                <a class="drop_item" href="#">О Нас</a>
            </div>
        </div>

        <a class="pt" href="#">Отделы<br>продаж</a>

        <div class="item">
            <a class="pt" href="#">Поставщики</a>
            <div class="drop">
                <div class="sub-item">
                    <a class="drop_item" href="#">ООО "Дизайн"</a>
                    <div class="drop">
                        <a class="drop_item" href="#">Отдел полиграфии</a>
                        <a class="drop_item" href="#">Веб-студия</a>
                    </div>
                </div>
                <a class="drop_item" href="#">ООО "Арт"</a>
                <a class="drop_item" href="#">ООО "Фотостиль"</a>
            </div>
        </div>

        <a class="pt" href="#">Наши услуги</a>
        <a class="pt" href="#">Контакты</a>
        <a class="pt" href="#">О нас</a>
    </div>

</body>
</html>
